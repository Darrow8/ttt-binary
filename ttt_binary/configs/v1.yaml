# Skill-chained subproblem-generation pipeline — v1 defaults.
# See claude_content/brainstorm/PIPELINE_SPEC.md and REVISIONS.md.

n_skills: 10                  # X — skill pool size
m: 3                          # M — chain length (fixed for v1)

# Stage 3 consensus-based calibration (REVISIONS.md):
#   accept iff p1 in [band_lo, band_hi] AND p2 < ambiguity_threshold AND
#               unparseable <= max_unparseable
band_lo: 0.4                  # aggregate r_bar lower bound (mean per-part p1)
band_hi: 0.6                  # aggregate r_bar upper bound
ambiguity_threshold: 0.2      # per-part max allowed second-cluster fraction
# Per-part unparseable cap. Loosened from 3 -> 5 because multi-part chains
# legitimately cascade-fail downstream parsing when an upstream part is wrong;
# anything <=50% unparseable is normal cascade, >50% is a real quality signal.
max_unparseable: 5

k_calibrate: 20               # critic attempts per generated subproblem (sharper consensus, more reliable per-part p1)
k_solve: 16                   # solver attempts per accepted subproblem in stage 4
max_regen: 10                 # regeneration cap per combination (lets shortcut-aware feedback iterate)

generator_model: "openai/gpt-oss-120b-maas"
critic_model: "openai/gpt-oss-120b-maas"
solver_model: "openai/gpt-oss-120b-maas"
temperature: 0.7
workers: 8
