# Configuration for reproducing the TTT-Discover conics-50 experiment
# using the tinker-cookbook RL stack with ORIGINAL DeepSeek GRPO settings.
#
# Usage:
#   python train_tinker_grpo.py --config=cookbook_grpo/configs/conics50.yaml
#
# This config matches the original DeepSeekMath GRPO paper (arXiv:2402.03300):
#   - KL penalty β=0.04 against base model
#   - Sequence-level loss normalization (1/|o_i|)
#   - Std-normalized advantages: A_i = (r_i - mean) / std

model_name: "openai/gpt-oss-120b"
log_path: "./cookbook-grpo-conics100"

# Training hyperparameters from the paper
learning_rate: 5.0e-5
max_tokens: 16384
lora_rank: 32
temperature: 1.0

# Checkpointing
save_every: 5
eval_every: 10

# Logging: disable per-iteration HTML/JSON disk artifacts (bloats ~4.5MB/step).
# log_samples_every=10 writes rollout HTML only at steps 0, 10, 20, ...
num_groups_to_log: 4
rollout_json_export: false
log_samples_every: 10

# W&B
wandb_project: "ttt-cookbook-conics100"

# Loss / algorithm

# Use PPO loss for actual clipping. Tinker's importance_sampling loss accepts
# no kwargs (the server raises 'ImportanceSamplingLoss() takes no arguments'
# if loss_fn_config is non-empty). PPO clip thresholds default to 0.8/1.2 per
# https://tinker-docs.thinkingmachines.ai/tinker/losses/ppo/ ; we set them
# explicitly to match the prior clip_epsilon=0.2 intent.
loss_fn: "ppo"
loss_fn_config:
  clip_low_threshold: 0.8
  clip_high_threshold: 1.2
remove_constant_reward_groups: true

# KL penalty against reference (base) model — original GRPO uses β=0.04
kl_penalty_coef: 0.04
kl_discount_factor: 0.0
kl_reference_config:
  base_model: "openai/gpt-oss-120b"

# Dataset builder settings
dataset_builder:
  data_path: "./subproblem-datasets/conics-reproduce-100.json"
  batch_size: 25
  group_size: 16
  num_epochs: 15
  prompt_suffix: " Put your final answer inside \\boxed{}."
  system_prompt: |
    You are a careful and rigorous math student working through an advanced mathematics problem. Your goal is to solve the problem step by step.

    Show all important intermediate reasoning, derivations, and calculations. Explain why each step is valid and reference any relevant theorems or identities when appropriate. Avoid skipping logical steps or making large jumps in reasoning.

    If the problem involves multiple cases or approaches, consider them systematically. Use clear mathematical notation and keep the solution organized.

    After completing the reasoning, clearly state the final answer.
  reward_correct: 1.0
  reward_wrong: 0.0
  reward_none: -0.5
  shuffle: true
  seed: 42
